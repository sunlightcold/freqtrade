name: Fork GHCR Docker Image

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      docker_tag:
        description: "Docker tag to publish"
        required: false
        default: "develop"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push GHCR image
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Prepare image tags
        id: image
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.docker_tag }}
        run: |
          REPOSITORY="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          TAG="$(echo "${TAG}" | sed -e 's#[^A-Za-z0-9_.-]#_#g')"
          SHORT_SHA="${GITHUB_SHA::12}"

          echo "${GITHUB_SHA}" > freqtrade_commit
          echo "image=ghcr.io/${REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push runtime image
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.image }}
          TAG: ${{ steps.image.outputs.tag }}
          SHORT_SHA: ${{ steps.image.outputs.short_sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --secret id=github_token,env=GITHUB_TOKEN \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:sha-${SHORT_SHA}" \
            --push \
            --provenance=false \
            .

      - name: Tag latest from develop
        if: steps.image.outputs.tag == 'develop'
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${TAG}"
