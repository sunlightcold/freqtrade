name: Fork FreqUI ZH Docker Image

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      docker_tag:
        description: "Docker tag to publish"
        required: false
        default: "develop"
        type: string
      frequi_ref:
        description: "FreqUI git ref/tag to build"
        required: false
        default: "3.0.2"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push Chinese FreqUI image
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Prepare image tags
        id: image
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.docker_tag }}
          INPUT_FREQUI_REF: ${{ inputs.frequi_ref }}
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_FREQUI_REF}" ]; then
            FREQUI_REF="${INPUT_FREQUI_REF}"
          else
            FREQUI_REF="3.0.2"
          fi

          TAG="$(echo "${TAG}" | sed -e 's#[^A-Za-z0-9_.-]#_#g')"
          SHORT_SHA="${GITHUB_SHA::12}"

          echo "image=ghcr.io/${OWNER}/freqtrade-frequi-zh" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "frequi_ref=${FREQUI_REF}" >> "$GITHUB_OUTPUT"

      - name: Build and push Chinese FreqUI image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          TAG: ${{ steps.image.outputs.tag }}
          SHORT_SHA: ${{ steps.image.outputs.short_sha }}
          FREQUI_REF: ${{ steps.image.outputs.frequi_ref }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --build-arg "FREQUI_REF=${FREQUI_REF}" \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:sha-${SHORT_SHA}" \
            --push \
            --provenance=false \
            --file docker/frequi-zh/Dockerfile \
            .

      - name: Tag latest from develop
        if: steps.image.outputs.tag == 'develop'
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${TAG}"
