---
services:
  freqtrade:
    image: "${FREQTRADE_IMAGE:?Set FREQTRADE_IMAGE in .env}"
    restart: unless-stopped
    container_name: ${FREQTRADE_CONTAINER_NAME:-freqtrade}
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "./freqtrade/rpc/api_server/ui/installed:/freqtrade/freqtrade/rpc/api_server/ui/installed"
    ports:
      - "${FREQTRADE_API_BIND:-127.0.0.1}:${FREQTRADE_API_PORT:-8080}:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config_martingale.json
      --strategy RiskManagedMartingaleStrategy

  frequi-init:
    image: "${FREQTRADE_IMAGE:?Set FREQTRADE_IMAGE in .env}"
    container_name: ${FREQUI_INIT_CONTAINER_NAME:-frequi-init}
    volumes:
      - "./freqtrade/rpc/api_server/ui/installed:/freqtrade/freqtrade/rpc/api_server/ui/installed"
    command: >
      install-ui

  frequi:
    image: ${FREQUI_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    container_name: ${FREQUI_CONTAINER_NAME:-frequi}
    depends_on:
      frequi-init:
        condition: service_completed_successfully
    volumes:
      - "./freqtrade/rpc/api_server/ui/installed:/usr/share/nginx/html:ro"
    ports:
      - "${FREQUI_BIND:-127.0.0.1}:${FREQUI_PORT:-8081}:80"
